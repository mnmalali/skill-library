[build-system]
requires = ["setuptools>=77,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-library-local"
version = "0.1.0"
description = "A local, shared Agent Skills library with project-scoped fetching"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Skill Library contributors"}]
dependencies = ["PyYAML>=6.0.2,<7"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: OS Independent"]

[project.scripts]
skill-library = "skill_library.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
skill_library = ["management_skills/*/SKILL.md", "management_skills/*/agents/openai.yaml", "management_skills/*/references/WORKFLOW.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
